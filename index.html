<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Điểm Danh Sinh Viên</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: rgb(33, 64, 154); /* Xanh IUH */
            --accent-color: rgb(253, 185, 36);  /* Vàng/Cam */
            --bg-color: #f4f7f6;
            --text-color: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            padding: 40px 30px;
            text-align: center;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            color: #666;
            font-weight: 600;
        }
        
        .header .sub-text {
            font-size: 13px;
            color: #888;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary-color);
            font-size: 15px;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            background-color: #f9f9f9;
        }

        input[type="text"]:focus,
        select:focus {
            border-color: var(--primary-color);
            outline: none;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(33, 64, 154, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: rgb(25, 49, 117);
        }
        
        button:active {
            background-color: var(--accent-color);
            color: var(--primary-color);
        }
        
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            color: #666;
        }

        #message {
            margin-top: 20px;
            font-weight: 600;
            font-size: 14px;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
        
        .loading {
            opacity: 0.7;
            pointer-events: none;
        }
        
        #lockScreen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        #lockScreen h2 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        
        #formContainer {
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>ĐIỂM DANH</h1>
            <p>GV: Nguyễn Thị Phương Thúy</p>
            <p class="sub-text">Viện Tài chính - Kế toán<br>Trường Đại học Công nghiệp TP.HCM</p>
        </div>

        <div id="lockScreen">
            <h2>Đã Điểm Danh</h2>
            <p>Thiết bị này đã được sử dụng để điểm danh.<br>Không thể điểm danh lại.</p>
            <div id="attendanceInfo" style="display:none; margin-top:15px; padding:15px; background-color:#d4edda; color:#155724; border-radius:8px; text-align:left; width:100%;"></div>
        </div>

        <div id="formContainer">
            <form id="attendanceForm">
                <div class="form-group">
                    <label for="classname">Lớp học phần:</label>
                    <select id="classname" name="classname" required>
                        <option value="" disabled selected>-- Chọn lớp học --</option>
                        <option value="DHKT20C">DHKT20C</option>
                        <option value="DHKT20C_TCTA">DHKT20C_TCTA</option>
                        <option value="DHKT20A">DHKT20A</option>
                        <option value="DH18TT_HL_N1">DH18TT_HL_N1 - Tiết 1-3</option>
                        <option value="DH18TT_HL">DH18TT_HL - Tiết 4-6</option>
                        <option value="DHQTLOG21C">DHQTLOG21C</option>
                        <option value="DHMK21A">DHMK21A</option>
                        <option value="DHDIGITAL21A_TCTA">DHDIGITAL21A_TCTA</option>
                        <option value="DHDIGITAL21C_TCTA">DHDIGITAL21C_TCTA</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="mssv">Mã số sinh viên:</label>
                    <input type="text" id="mssv" name="mssv" placeholder="Nhập chính xác để hệ thống ghi nhận" required pattern="[0-9]{8,10}" title="Vui lòng nhập đúng định dạng">
                </div>

                <div class="form-group">
                    <label for="studentName">Họ và tên:</label>
                    <input type="text" id="studentName" name="studentName" placeholder="Nhập đầy đủ họ tên có dấu tiếng Việt" required>
                </div>
                
                <!-- Ẩn trạng thái, mặc định luôn gửi là 'Có mặt' -->
                <input type="hidden" name="status" value="Có mặt">

                <button type="submit" id="submitBtn">Ghi nhận điểm danh</button>
            </form>
            <div id="message"></div>
        </div>
    </div>

    <script>
        // THAY THẾ URL DƯỚI ĐÂY BẰNG WEB APP URL TỪ GOOGLE APPS SCRIPT CỦA BẠN
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwYkLIY1fWiWl4ogO5Z9vLFrBQheKuOFYWnuAW082heG2Fis9porwnBqB6KXI9k8UmiFQ/exec'; 
        
        const form = document.getElementById('attendanceForm');
        const messageDiv = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');
        const formContainer = document.getElementById('formContainer');
        const lockScreen = document.getElementById('lockScreen');
        const attendanceInfo = document.getElementById('attendanceInfo');

        // Hiển thị thông tin Lớp / Họ tên / MSSV vừa điểm danh vào màn hình khóa
        function showAttendanceInfo(className, studentName, mssvValue) {
            attendanceInfo.innerHTML =
                '<p><strong>Lớp học phần:</strong> ' + className + '</p>' +
                '<p><strong>Họ và tên:</strong> ' + studentName + '</p>' +
                '<p><strong>MSSV:</strong> ' + mssvValue + '</p>';
            attendanceInfo.style.display = 'block';
        }

        // KIỂM TRA THIẾT BỊ ĐÃ ĐIỂM DANH CHƯA
        // Khóa theo ngày hiện tại để mỗi thiết bị chỉ điểm danh 1 lần/ngày
        const today = new Date().toLocaleDateString('vi-VN');
        const hasAttendedToday = localStorage.getItem('attended_' + today);

        if (hasAttendedToday) {
            formContainer.style.display = 'none';
            lockScreen.style.display = 'flex';

            // Nếu đã lưu thông tin lần điểm danh trước đó trên thiết bị này thì hiển thị lại
            const savedInfo = localStorage.getItem('attendanceInfo_' + today);
            if (savedInfo) {
                try {
                    const info = JSON.parse(savedInfo);
                    showAttendanceInfo(info.className, info.studentName, info.mssv);
                } catch (e) { /* bỏ qua nếu dữ liệu lỗi */ }
            }
        }

        form.addEventListener('submit', e => {
            e.preventDefault();
            
            if(scriptURL === 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE') {
                showMessage("Lỗi: Bạn chưa cấu hình đường dẫn Google Apps Script (URL).", false);
                return;
            }

            // Client-side format check (optional backup)
            const mssv = document.getElementById('mssv').value.trim();
            if(mssv.length < 8) {
                showMessage("Mã số sinh viên không hợp lệ.", false);
                return;
            }

            submitBtn.classList.add('loading');
            submitBtn.textContent = 'Đang xử lý...';
            submitBtn.disabled = true;
            
            const formData = new FormData(form);
            // Gửi kèm tham số action = 'attendance'
            formData.append('action', 'attendance');
            
            // Lấy timestamp từ client
            const timestamp = new Date().toLocaleString('vi-VN');
            formData.append('timestamp', timestamp);

            fetch(scriptURL, { method: 'POST', body: formData})
                .then(response => response.json())
                .then(data => {
                    if(data.result === 'success') {
                        // Thành công: Đánh dấu thiết bị đã điểm danh
                        localStorage.setItem('attended_' + today, 'true');

                        // Lấy thông tin vừa điểm danh để hiển thị
                        const classSelect = document.getElementById('classname');
                        const className = classSelect.options[classSelect.selectedIndex].text;
                        const studentName = document.getElementById('studentName').value.trim();

                        localStorage.setItem('attendanceInfo_' + today, JSON.stringify({
                            className: className,
                            studentName: studentName,
                            mssv: mssv
                        }));

                        showMessage(
                            "Điểm danh thành công!<br>Lớp: " + className +
                            "<br>Họ tên: " + studentName +
                            "<br>MSSV: " + mssv,
                            true
                        );
                        showAttendanceInfo(className, studentName, mssv);
                        
                        // Khóa màn hình sau 3 giây
                        setTimeout(() => {
                            formContainer.style.display = 'none';
                            lockScreen.style.display = 'flex';
                        }, 3000);
                        
                    } else if (data.result === 'duplicate_mssv') {
                        // Trùng MSSV trong Sheet
                        showMessage("Lỗi: Mã số sinh viên này đã được điểm danh trước đó!", false);
                        submitBtn.classList.remove('loading');
                        submitBtn.textContent = 'Ghi nhận điểm danh';
                        submitBtn.disabled = false;
                    } else {
                        throw new Error(data.error || "Unknown error");
                    }
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    showMessage("Có lỗi xảy ra kết nối hệ thống, vui lòng thử lại.", false);
                    submitBtn.classList.remove('loading');
                    submitBtn.textContent = 'Ghi nhận điểm danh';
                    submitBtn.disabled = false;
                });
        });

        function showMessage(text, isSuccess) {
            messageDiv.innerHTML = text;
            messageDiv.style.display = 'block';
            messageDiv.className = isSuccess ? 'success' : 'error';
        }
    </script>
</body>
</html>
